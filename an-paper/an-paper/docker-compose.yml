version: '3.8'

services:
  # Service 1: MySQL Database
  mysql:
    image: mysql:8.0
    container_name: anpaper_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: anpaper_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - anpaper-network

  # Service 2: App Spring Boot (A.N PAPER)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anpaper_app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    volumes:
      # Mount thư mục uploads từ container ra máy host để không mất file khi restart
      - ./uploads:/app/uploads
    networks:
      - anpaper-network

  # Service 3: Giao diện quản lý MySQL (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: anpaper_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root123
    depends_on:
      - mysql
    networks:
      - anpaper-network

volumes:
  mysql_data:

networks:
  anpaper-network:
    driver: bridge