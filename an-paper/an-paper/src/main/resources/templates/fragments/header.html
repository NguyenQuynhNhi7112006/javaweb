<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- Định nghĩa Fragment Header -->
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold fs-3" href="/">A.N PAPER</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link text-white" href="/">Trang chủ</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="/#about">Giới thiệu</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="/#products">Sản phẩm</a></li>
                    </ul>
                    
                    <div class="d-flex align-items-center gap-2">
                        <!-- Nút Giỏ hàng -->
                        <a href="/cart" class="btn btn-light">🛒 Giỏ hàng</a>

                        <!-- Khi CHƯA ĐĂNG NHẬP -->
                        <th:block sec:authorize="isAnonymous()">
                            <a href="/login" class="btn btn-warning">Đăng nhập</a>
                            <a href="/register" class="btn btn-outline-light">Đăng ký</a>
                        </th:block>

                        <!-- Khi ĐÃ ĐĂNG NHẬP -->
                        <th:block sec:authorize="isAuthenticated()">
                            <a href="/user/my-orders" class="btn btn-outline-light">Đơn hàng của tôi</a>
                            
                            <!-- Nếu là ADMIN thì hiện nút vào Dashboard -->
                            <a sec:authorize="hasRole('ADMIN')" href="/admin" class="btn btn-danger">Trang Admin</a>

                            <!-- Nút Đăng xuất -->
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-outline-warning">Đăng xuất</button>
                            </form>
                        </th:block>
                    </div>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
