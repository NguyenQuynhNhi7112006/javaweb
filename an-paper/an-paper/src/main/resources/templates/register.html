<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản - A.N PAPER</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- NHÚNG HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container my-5 flex-grow-1 d-flex justify-content-center align-items-center">
        <div class="card shadow-lg p-4 style-register" style="width: 100%; max-width: 450px; border-radius: 12px;">
            <h3 class="text-center text-success fw-bold mb-4">ĐĂNG KÝ TÀI KHOẢN</h3>
            
            <!-- Thông báo lỗi nếu trùng username/email -->
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Họ và Tên:</label>
                    <input type="text" name="fullName" class="form-control" placeholder="Nguyễn Văn A" required>
                </div>

                <div class="mb-3">
                    <label class="form-label font-weight-bold">Tên đăng nhập (Username):</label>
                    <input type="text" name="username" class="form-control" placeholder="Nhập username..." required>
                </div>

                <div class="mb-3">
                    <label class="form-label font-weight-bold">Email:</label>
                    <input type="email" name="email" class="form-control" placeholder="example@gmail.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label font-weight-bold">Mật khẩu:</label>
                    <input type="password" name="password" class="form-control" placeholder="Tạo mật khẩu..." required>
                </div>

                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2">Đăng Ký Ngay</button>
            </form>

            <div class="text-center mt-3">
                <small>Đã có tài khoản? <a href="/login" class="text-success font-weight-bold">Đăng nhập tại đây</a></small>
            </div>
        </div>
    </main>

    <!-- NHÚNG FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
