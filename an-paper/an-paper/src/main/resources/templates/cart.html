<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ Hàng - A.N PAPER</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- NHÚNG HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container my-5 flex-grow-1">
        <h2 class="text-success mb-4">🛒 Giỏ Hàng Của Bạn</h2>

        <!-- Nếu giỏ hàng trống -->
        <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info text-center py-4">
            Giỏ hàng của bạn đang trống! <br>
            <a href="/" class="btn btn-success mt-3">Quay lại mua sắm</a>
        </div>

        <!-- Nếu có sản phẩm trong giỏ -->
        <div th:unless="${#lists.isEmpty(cartItems)}">
            <table class="table table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cartItems}">
                        <td th:text="${item.product.name}"></td>
                        <td th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"></td>
                        <td th:text="${item.quantity}"></td>
                        <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"></td>
                        <td>
                            <form th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post">
                                <button class="btn btn-outline-danger btn-sm">Xóa</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-between align-items-center mt-4 p-3 bg-light rounded">
                <h4>Tổng tiền thanh toán: <span class="text-danger font-weight-bold" th:text="${#numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"></span></h4>
                
                <form th:action="@{/checkout}" method="post">
                    <button type="submit" class="btn btn-success btn-lg fw-bold">Đặt Hàng Ngay (COD)</button>
                </form>
            </div>
        </div>
    </main>

    <!-- NHÚNG FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
