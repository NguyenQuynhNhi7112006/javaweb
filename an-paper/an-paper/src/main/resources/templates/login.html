<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập - A.N PAPER</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- NHÚNG HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container my-5 flex-grow-1 d-flex justify-content-center align-items-center">
        <div class="card shadow-lg p-4 style-login" style="width: 100%; max-width: 400px; border-radius: 12px;">
            <h3 class="text-center text-success fw-bold mb-4">ĐĂNG NHẬP</h3>
            
            <!-- Thông báo lỗi nếu đăng nhập sai -->
            <div th:if="${param.error}" class="alert alert-danger py-2 small">
                Tài khoản hoặc mật khẩu không chính xác!
            </div>
            
            <!-- Thông báo khi đã logout -->
            <div th:if="${param.logout}" class="alert alert-info py-2 small">
                Bạn đã đăng xuất thành công.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Tên đăng nhập (Username):</label>
                    <input type="text" name="username" class="form-control" placeholder="Nhập username..." required>
                </div>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Mật khẩu:</label>
                    <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu..." required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2">Đăng Nhập</button>
            </form>
        </div>
    </main>

    <!-- NHÚNG FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
