<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đơn Hàng Của Tôi - A.N PAPER</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- NHÚNG HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container my-5 flex-grow-1">
        <h2>Đơn Hàng Của Tôi</h2>
        <a href="/" class="btn btn-outline-secondary mb-3">Quay lại Cửa hàng</a>

        <table class="table table-striped table-bordered align-middle">
            <thead>
                <tr>
                    <th>Mã Đơn</th>
                    <th>Tổng Tiền</th>
                    <th>Trạng Thái</th>
                    <th>Hành Động Khách Hàng</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="'#' + ${o.id}"></td>
                    <td th:text="${o.totalAmount} + ' VNĐ'"></td>
                    <td>
                        <span th:if="${o.status == 'PENDING'}" class="badge bg-warning">Chờ Xác Nhận</span>
                        <span th:if="${o.status == 'SHIPPED'}" class="badge bg-primary">Admin Đã Giao Hàng</span>
                        <span th:if="${o.status == 'PAID'}" class="badge bg-success">Đã Nhận & Thanh Toán</span>
                    </td>
                    <td>
                        <form th:if="${o.status == 'SHIPPED'}" th:action="@{/user/orders/{id}/confirm-received(id=${o.id})}" method="post">
                            <button type="submit" class="btn btn-success btn-sm">✔ Đã Nhận Hàng & Thanh Toán</button>
                        </form>
                        <span th:if="${o.status == 'PAID'}" class="text-success fw-bold">✓ Hoàn Tất Đơn Hàng</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <!-- NHÚNG FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
