<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi Tiết Sản Phẩm - A.N PAPER</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- NHÚNG HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container my-5 flex-grow-1">
        <a href="/" class="btn btn-secondary mb-3">← Quay lại Trang chủ</a>
        
        <div class="row">
            <div class="col-md-5">
                <img th:src="${product.imageUrl}" class="img-fluid rounded shadow">
            </div>
            <div class="col-md-7">
                <h2 th:text="${product.name}"></h2>
                <h4 class="text-danger my-3" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"></h4>
                <p th:text="${product.description}"></p>
            </div>
        </div>

        <hr class="my-5">

        <!-- KHU VỰC ĐÁNH GIÁ -->
        <h3>Đánh Giá Từng Khách Hàng</h3>

        <div th:if="${canReview}" class="card p-3 my-3 bg-light">
            <h5>Viết Đánh Giá Của Bạn (Đính kèm Ảnh/Video)</h5>
            <form action="/reviews/add" method="post" enctype="multipart/form-data">
                <input type="hidden" name="productId" th:value="${product.id}"/>
                <div class="mb-2">
                    <label>Đánh giá sao:</label>
                    <select name="rating" class="form-select w-25">
                        <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                        <option value="4">⭐⭐⭐⭐ (4/5)</option>
                        <option value="3">⭐⭐⭐ (3/5)</option>
                    </select>
                </div>
                <div class="mb-2">
                    <textarea name="comment" class="form-control" placeholder="Nhận xét sản phẩm giấy bèo..." required></textarea>
                </div>
                <div class="mb-2">
                    <label>Tải lên Ảnh hoặc Video sản phẩm:</label>
                    <input type="file" name="mediaFile" accept="image/*,video/*" class="form-control">
                </div>
                <button type="submit" class="btn btn-success">Gửi Đánh Giá</button>
            </form>
        </div>
        <div th:unless="${canReview}" class="alert alert-warning my-3">
            * Bạn cần <strong>Mua sản phẩm này & Hoàn tất nhận hàng</strong> để có thể viết đánh giá kèm hình ảnh/video.
        </div>

        <!-- DANH SÁCH REVIEW -->
        <div class="mt-4">
            <div th:each="r : ${reviews}" class="border-bottom py-3">
                <strong th:text="${r.user.fullName}"></strong> 
                <span class="text-warning" th:text="'★ ' + ${r.rating}"></span>
                <p class="mb-1" th:text="${r.comment}"></p>

                <div th:if="${r.mediaUrl}">
                    <img th:if="${r.mediaType == 'IMAGE'}" th:src="${r.mediaUrl}" width="150" class="rounded border me-2">
                    <video th:if="${r.mediaType == 'VIDEO'}" th:src="${r.mediaUrl}" width="250" controls class="rounded border"></video>
                </div>
                <small class="text-muted" th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
            </div>
        </div>
    </main>

    <!-- NHÚNG FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
